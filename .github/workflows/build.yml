name: Build APK

# Runs every time you push changes, or when you press "Run workflow" on the Actions tab.
on:
  push:            # any branch (Android Studio often calls it "master", GitHub "main")
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Use the signing key from secrets (if set)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using the signing key from secrets"
          else
            echo "No KEYSTORE_BASE64 secret: using app/release.keystore from the repo"
          fi

      - name: Build the APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk TravelDuaa.apk

      - name: Save APK on the run page
        uses: actions/upload-artifact@v4
        with:
          name: TravelDuaa-apk
          path: TravelDuaa.apk

      - name: Publish as a Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Travel Duaa build ${{ github.run_number }}
          body: Download TravelDuaa.apk below and install it on your phone or head unit.
          files: TravelDuaa.apk
          make_latest: true

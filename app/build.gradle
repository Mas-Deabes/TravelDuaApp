plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sif.travelduaa'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sif.travelduaa'
        minSdk 21
        // 34, not 35: Android 15 blocks some start-up behaviour for apps that target 35.
        targetSdk 34
        // Each GitHub build gets a higher number, so a new APK installs over the old one.
        versionCode = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName = "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        // e.g. "sif/TravelDuaApp": lets the app check this repo's Releases for updates.
        resValue "string", "github_repo", (System.getenv('GITHUB_REPOSITORY') ?: '')
    }

    // Signing key: on GitHub it comes from the repo's secrets (KEYSTORE_BASE64 etc.), so it's never
    // in the code. Builds on your PC without the key are signed with Android Studio's debug key:
    // fine for testing, but they can't update a version installed from GitHub.
    def keystorePath = System.getenv('KEYSTORE_FILE')
    def haveKey = keystorePath != null && file(keystorePath).exists()

    signingConfigs {
        if (haveKey) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'duaa'
                keyPassword System.getenv('KEY_PASSWORD') ?: System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig haveKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
